<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B0BEC5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FF9800" flood-opacity="0.35"/>
    </filter>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#37474F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sun Rays & Core -->
  <g filter="url(#glow)">
    <circle cx="26" cy="24" r="14" fill="url(#sunGrad)"/>
    <!-- Sun flares -->
    <path d="M26 6v4 M26 38v4 M8 24h4 M40 24h4 M13.3 11.3l2.8 2.8 M35.9 33.9l2.8 2.8 M13.3 36.7l2.8-2.8 M35.9 14.1l2.8-2.8" 
          stroke="#FFA726" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Front Cloud -->
  <path filter="url(#cloudShadow)" 
        d="M20 48h26a11 11 0 0 0 2.2-21.8 14 14 0 0 0-26.4-3.2A11 11 0 0 0 20 48z" 
        fill="url(#cloudGrad)"/>
</svg>
